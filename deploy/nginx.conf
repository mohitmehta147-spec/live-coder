# ============================================================================
# VedicUpchar — Nginx reverse proxy for the PM2 Node app
# Place at: /etc/nginx/sites-available/vedicupchar.conf
#   ln -s /etc/nginx/sites-available/vedicupchar.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# Replace vedicupchar.com with your domain (or the Hostinger temp domain).
# ============================================================================

upstream vedicupchar_app {
    server 127.0.0.1:3000;      # must match PORT in .env / ecosystem.config.cjs
    keepalive 32;
}

# --- HTTP: redirect everything to HTTPS (certbot also manages this block) ---
server {
    listen 80;
    listen [::]:80;
    server_name vedicupchar.com www.vedicupchar.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vedicupchar.com www.vedicupchar.com;

    # certbot --nginx -d vedicupchar.com -d www.vedicupchar.com
    ssl_certificate     /etc/letsencrypt/live/vedicupchar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vedicupchar.com/privkey.pem;

    client_max_body_size 25M;        # product / blog / review image uploads
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # ---- API (never cached) ----
    location /api/ {
        proxy_pass http://vedicupchar_app;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-store" always;
    }

    # ---- Health check (used after every deploy) ----
    location = /api/health {
        proxy_pass http://vedicupchar_app;
        access_log off;
        add_header Cache-Control "no-store" always;
    }

    # ---- Uploaded media: serve straight from disk, fall back to the app ----
    location /uploads/ {
        alias /home/USER/domains/vedicupchar.com/app/uploads/;   # <-- your UPLOAD_DIR
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        try_files $uri @app;
    }

    # ---- Hashed Vite assets ----
    location /assets/ {
        proxy_pass http://vedicupchar_app;
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    # ---- Everything else -> React SPA served by Express ----
    location / {
        proxy_pass http://vedicupchar_app;
    }

    location @app {
        proxy_pass http://vedicupchar_app;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
}
